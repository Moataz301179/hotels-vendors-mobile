name: Mobile Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, maintenance/quality-gates-20261005]

concurrency:
  group: hovin-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Bundle Android app
        run: npx expo export --platform android --output-dir dist/android
      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir dist/ios
